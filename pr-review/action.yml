name: 'Pi PR Review'
description: 'Review a pull request with Pi and post one review: approve or request changes (or a plain comment), collapsing its older reviews.'
author: 'fezcodev'

branding:
  icon: 'eye'
  color: 'purple'

# The agent never writes to GitHub, or to disk. The action prefetches the PR
# (metadata, diff, earlier reviews) into a directory, the agent reads that and
# the checkout with read-only tools and answers with its verdict as its final
# message, and a separate step posts exactly one review pinned to the reviewed
# commit and collapses this identity's older ones. Without a write tool the
# agent cannot alter the scripts that later run with the write token.
#
# Check out the PR before this action (actions/checkout on a pull_request event
# does) with `persist-credentials: false`; the action refuses a checkout holding a token.

inputs:
  cliproxyapi-api-key:
    description: 'CLIProxyAPI client key. Required.'
    required: true
  cliproxyapi-base-url:
    description: 'CLIProxyAPI OpenAI-compatible base URL, including /v1, e.g. https://cpa.example.com/v1. Must be reachable from the runner.'
    required: true
  pr-number:
    description: 'Pull request to review.'
    required: false
    default: ${{ github.event.pull_request.number }}
  head-sha:
    description: >-
      Head commit the checkout was made from. The review is skipped when the PR's live head differs,
      so the files on disk always match the diff being reviewed. Empty uses the triggering PR's head
      when reviewing that PR, and skips the check for any other.
    required: false
    default: ''
  base-ref:
    description: >-
      Base branch the checkout was merged against. The review is skipped when the PR has since been
      retargeted. Empty uses the triggering PR's base when reviewing that PR, and skips the check for
      any other.
    required: false
    default: ''
  repository:
    description: 'owner/name of the pull request''s repository. The checkout in the working directory must be this repository.'
    required: false
    default: ${{ github.repository }}
  mode:
    description: >-
      `verdict` (default) approves a clean PR and requests changes on one with findings.
      `comment` posts the same review as a plain COMMENT that never blocks a merge.
    required: false
    default: 'verdict'
  instructions:
    description: >-
      Inline review instructions (what matters, what to ignore). Appended after instructions-file
      when both are present.
    required: false
    default: ''
  instructions-file:
    description: >-
      Repository-relative path to a markdown file with review instructions, read from the PR's base
      branch. Fails the step if explicitly set and missing. When unset, `.github/pi/review.md` is
      loaded automatically if present on the base branch.
    required: false
    default: ''
  github-token:
    description: >-
      Token that posts the review (needs pull-requests: write), used when no App is configured. The
      agent never receives it. Approving with GITHUB_TOKEN needs the repo setting "Allow GitHub
      Actions to create and approve pull requests"; without it an approval is posted as a comment.
    required: false
    default: ${{ github.token }}
  app-client-id:
    description: 'GitHub App Client ID. When set, the review posts as <app-slug>[bot]; an agent given bash also gets a read-only App token for gh.'
    required: false
    default: ''
  app-private-key:
    description: 'GitHub App private key. Required when app-client-id is set.'
    required: false
    default: ''
  dry-run:
    description: 'Run the agent but post nothing; the planned review goes to the step summary.'
    required: false
    default: 'false'
  model:
    description: 'Gateway model.'
    required: false
    default: 'cpa/gpt-6.2-sol'
  fallback-models:
    description: 'Ordered fallback gateway models, comma- or newline-separated.'
    required: false
    default: 'cpa/claude-opus-5-5'
  thinking:
    description: 'Thinking level.'
    required: false
    default: 'high'
  message-threads:
    description: >-
      `true` sends Claude turns as Anthropic message threads: after the first request, each turn
      sends only the new messages. Needs CLIProxyAPI v8.0.76 or later.
    required: false
    default: 'false'
  tools:
    description: >-
      Agent tool allowlist. The default is read-only: everything the review needs is prefetched. Adding
      bash exposes the gateway key to commands the model runs, and bash or write lets prompt-injected
      PR text alter the post step that runs with the write token. Widen it only for trusted PRs.
    required: false
    default: 'read,grep,find,ls'
  max-turns:
    description: 'Assistant turn cap.'
    required: false
    default: '40'
  timeout-minutes:
    description: 'Wall-clock limit for the agent.'
    required: false
    default: '20'
  on-rate-limit:
    description: '`skip` (default) posts nothing and exits 0 when gateway quota is exhausted; `fail` fails the step.'
    required: false
    default: 'skip'
  pi-version:
    description: 'Pinned @earendil-works/pi-coding-agent version.'
    required: false
    default: '1.6.0'
  provider-extension-version:
    description: 'Pinned @hank-warren/pi-cliproxyapi-provider version.'
    required: false
    default: '0.6.0'
  upload-transcript:
    description: 'Upload the JSONL session transcript as an artifact.'
    required: false
    default: 'true'
  working-directory:
    description: 'Directory holding the pull request checkout, where the agent runs.'
    required: false
    default: '.'

outputs:
  skipped:
    description: '`true` when nothing ran (closed PR, bot-authored PR, or the head moved past head-sha).'
    value: ${{ steps.gate.outputs.run != 'true' }}
  verdict:
    description: '`approve` or `request-changes`, as judged by the agent.'
    value: ${{ steps.apply.outputs.verdict }}
  event:
    description: 'Review event actually posted: APPROVE, REQUEST_CHANGES or COMMENT.'
    value: ${{ steps.apply.outputs.event }}
  review-url:
    description: 'URL of the posted review.'
    value: ${{ steps.apply.outputs.review-url }}
  model-used:
    description: 'The model that produced the review.'
    value: ${{ steps.pi.outputs.model-used }}
  rate-limited:
    description: '`true` when gateway quota was exhausted.'
    value: ${{ steps.pi.outputs.rate-limited }}

runs:
  using: composite
  steps:
    - name: Check inputs
      id: inputs
      shell: bash
      env:
        PI_REPO: ${{ inputs.repository }}
        MODE: ${{ inputs.mode }}
        APP_ID: ${{ inputs.app-client-id }}
        APP_KEY: ${{ inputs.app-private-key }}
      run: |
        set -euo pipefail
        case "$MODE" in verdict|comment) ;; *) echo "::error title=pi-pr-review::mode must be verdict or comment, got '${MODE}'."; exit 1 ;; esac
        if [ -n "$APP_ID" ] && [ -z "$APP_KEY" ]; then
          echo "::error title=pi-pr-review::app-private-key is required with app-client-id."; exit 1
        fi
        [[ "$PI_REPO" == */* ]] || { echo "::error title=pi-pr-review::repository must be owner/name, got '${PI_REPO}'."; exit 1; }
        { echo "owner=${PI_REPO%%/*}"; echo "name=${PI_REPO#*/}"; } >> "$GITHUB_OUTPUT"

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # An empty list would make pi fall back to its default tools, write and bash included. Same
    # trimming as the runner, so no blank value slips past one and not the other.
    - name: Check tools and instructions-file
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
        PI_INSTRUCTIONS_FILE: ${{ inputs.instructions-file }}
      run: |
        set -euo pipefail
        node -e 'if (!process.env.TOOLS.split(",").some((t) => t.trim())) process.exit(1)' \
          || { echo "::error title=pi-pr-review::tools must name at least one tool."; exit 1; }
        node "${{ github.action_path }}/fetch-guidance.mjs" --validate

    # The write token is minted only after the agent exits (see "Mint App write token"):
    # read-only tools are no filesystem sandbox, and a token minted earlier sits in
    # runner files the agent could read.
    - name: Mint App read-only token
      id: read-token
      if: ${{ inputs.app-client-id != '' }}
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ steps.inputs.outputs.owner }}
        repositories: ${{ steps.inputs.outputs.name }}
        # Revoked before the agent starts unless the agent gets it (bash).
        skip-token-revoke: ${{ !contains(inputs.tools, 'bash') }}
        permission-contents: read
        permission-issues: read
        permission-pull-requests: read

    - name: Fetch the pull request
      id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ steps.read-token.outputs.token || inputs.github-token }}
        PI_REPO: ${{ inputs.repository }}
        PI_PR: ${{ inputs.pr-number }}
        PI_EXPECTED_SHA: ${{ inputs.head-sha }}
        PI_EXPECTED_BASE: ${{ inputs.base-ref }}
        PI_EVENT_PR: ${{ github.event.pull_request.number }}
        PI_EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        PI_EVENT_BASE: ${{ github.event.pull_request.base.ref }}
        PI_INSTRUCTIONS: ${{ inputs.instructions }}
        PI_INSTRUCTIONS_FILE: ${{ inputs.instructions-file }}
      run: |
        set -euo pipefail
        # Unset expectations come from the triggering PR, and only when it is the one under review.
        if [ "$PI_REPO" = "$GITHUB_REPOSITORY" ] && [ "$PI_PR" = "$PI_EVENT_PR" ]; then
          PI_EXPECTED_SHA="${PI_EXPECTED_SHA:-$PI_EVENT_SHA}"
          PI_EXPECTED_BASE="${PI_EXPECTED_BASE:-$PI_EVENT_BASE}"
        elif [ -n "$PI_EVENT_PR" ] && [ -z "$PI_EXPECTED_SHA" ]; then
          # The default checkout is the triggering PR; without head-sha nothing ties it to this one.
          echo "::error title=pi-pr-review::Reviewing #${PI_PR} from a pull_request run for #${PI_EVENT_PR} needs head-sha for the checkout you made."; exit 1
        fi
        [[ "$PI_PR" =~ ^[0-9]+$ ]] || { echo "::error title=pi-pr-review::pr-number must be a number, got '${PI_PR}'."; exit 1; }
        work="${RUNNER_TEMP}/pi-pr-review"
        rm -rf "$work" && mkdir -p "$work/in"
        gh api "repos/${PI_REPO}/pulls/${PI_PR}" --jq '{number, title, body, state, draft,
          author: .user.login, author_type: .user.type, base: .base.ref, head: .head.ref,
          head_sha: .head.sha, base_sha: .base.sha, additions, deletions, changed_files}' > "$work/in/pr.json"
        IFS=$'\t' read -r state type login sha < <(jq -r '[.state, .author_type, .author, .head_sha] | @tsv' "$work/in/pr.json")
        run=true
        partial=false
        if [ "$state" != "open" ]; then
          run=false; echo "::notice title=pi-pr-review::Skipping #${PI_PR}: it is ${state}."
        elif [ "$type" != "User" ]; then
          run=false; echo "::notice title=pi-pr-review::Skipping #${PI_PR}: opened by ${login} (${type}); Pi reviews human-authored PRs only."
        elif [ -n "$PI_EXPECTED_SHA" ] && [ "$PI_EXPECTED_SHA" != "$sha" ]; then
          run=false; echo "::notice title=pi-pr-review::Skipping #${PI_PR}: head is ${sha:0:7}, not the checked-out ${PI_EXPECTED_SHA:0:7}; the run for the newer push reviews it."
        elif [ -n "$PI_EXPECTED_BASE" ] && [ "$PI_EXPECTED_BASE" != "$(jq -r .base "$work/in/pr.json")" ]; then
          run=false; echo "::notice title=pi-pr-review::Skipping #${PI_PR}: it now targets $(jq -r .base "$work/in/pr.json"), not the checked-out ${PI_EXPECTED_BASE}."
        fi
        if [ "$run" = "true" ]; then
          gh api --paginate "repos/${PI_REPO}/pulls/${PI_PR}/files?per_page=100" \
            --jq '.[] | {filename, status, additions, deletions, previous_filename, patch}' \
            | jq -s . > "$work/in/files.json"
          # The diff endpoint refuses very large PRs; fall back to the per-file patches.
          if ! gh api "repos/${PI_REPO}/pulls/${PI_PR}" -H 'Accept: application/vnd.github.diff' > "$work/in/diff.patch" 2>/dev/null; then
            partial=true
            echo "::warning title=pi-pr-review::Full diff unavailable; using per-file patches (very large files may be missing)."
            jq -r '.[] | "--- \(.previous_filename // .filename)\n+++ \(.filename)\n\(.patch // "(no textual patch: binary or too large)")\n"' \
              "$work/in/files.json" > "$work/in/diff.patch"
          fi
          gh api --paginate "repos/${PI_REPO}/pulls/${PI_PR}/reviews?per_page=100" \
            --jq '.[] | {author: .user.login, state, submitted_at, commit_id, body}' | jq -s . > "$work/in/reviews.json"
          gh api --paginate "repos/${PI_REPO}/pulls/${PI_PR}/comments?per_page=100" \
            --jq '.[] | {author: .user.login, path, line, body, created_at}' | jq -s . > "$work/in/review-comments.json"
          # File-based instructions come from the base branch so a PR cannot rewrite the rules it
          # is reviewed by; inline instructions are appended when provided.
          PI_BASE_SHA="$(jq -r .base_sha "$work/in/pr.json")" \
          PI_BASE_REF="$(jq -r .base "$work/in/pr.json")" \
          PI_GUIDANCE_OUT="$work/in/review-guidance.md" \
          node "${{ github.action_path }}/fetch-guidance.mjs"
        fi
        {
          echo "run=${run}"
          echo "head-sha=${sha}"
          echo "base-ref=$(jq -r .base "$work/in/pr.json")"
          echo "partial-diff=${partial}"
          echo "in=${work}/in"
        } >> "$GITHUB_OUTPUT"

    # Read-only tools are no filesystem sandbox: the token stays in runner files the agent could
    # read. An agent without bash cannot use it, so it is dead before the agent starts.
    - name: Revoke the read-only token
      if: ${{ always() && steps.read-token.outputs.token != '' && !contains(inputs.tools, 'bash') }}
      shell: bash
      env:
        GH_TOKEN: ${{ steps.read-token.outputs.token }}
      run: gh api -X DELETE installation/token --silent

    # actions/checkout persists its token in git config (or a file that config includes) unless
    # persist-credentials is false; read-only tools could read it.
    - name: Check the checkout holds no credentials
      if: ${{ steps.gate.outputs.run == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if git config --includes --get-regexp '^http\..*extraheader$' >/dev/null 2>&1; then
          echo "::error title=pi-pr-review::The checkout persisted its GitHub token, which the agent could read. Check out with persist-credentials: false."
          exit 1
        fi

    - name: Install pi
      if: ${{ steps.gate.outputs.run == 'true' }}
      shell: bash
      env:
        PI_VERSION: ${{ inputs.pi-version }}
        PROVIDER_EXTENSION_VERSION: ${{ inputs.provider-extension-version }}
      run: bash "${{ github.action_path }}/../lib/install-pi.sh"

    - name: Review with Pi
      id: pi
      if: ${{ steps.gate.outputs.run == 'true' }}
      shell: bash
      env:
        # The prompt carries everything the skill needs, so the agent has no reason to read its
        # environment, which holds the gateway key.
        PI_ACTION_PROMPT: >-
          Review pull request #${{ inputs.pr-number }} in ${{ inputs.repository }} following the
          pr-review skill, and end with your verdict message. The prefetched context directory is
          ${{ steps.gate.outputs.in }}. Review mode: ${{ inputs.mode }}.
        PI_ACTION_PROMPT_FILE: ''
        PI_ACTION_SKILL: ${{ github.action_path }}/skill
        PI_ACTION_APPEND_SYSTEM_PROMPT: ''
        PI_ACTION_MODEL: ${{ inputs.model }}
        PI_ACTION_FALLBACK_MODELS: ${{ inputs.fallback-models }}
        PI_ACTION_THINKING: ${{ inputs.thinking }}
        PI_ACTION_MESSAGE_THREADS: ${{ inputs.message-threads }}
        PI_ACTION_TOOLS: ${{ inputs.tools }}
        PI_ACTION_MAX_TURNS: ${{ inputs.max-turns }}
        PI_ACTION_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        PI_ACTION_ON_RATE_LIMIT: ${{ inputs.on-rate-limit }}
        PI_ACTION_CPA_API_KEY: ${{ inputs.cliproxyapi-api-key }}
        PI_ACTION_CPA_BASE_URL: ${{ inputs.cliproxyapi-base-url }}
        PI_ACTION_EXTENSION_DIR: ${{ runner.temp }}/pi-ext
        # Only an agent with bash can use gh; read-only tools get no GitHub credential at all.
        PI_ACTION_GH_TOKEN: ${{ contains(inputs.tools, 'bash') && steps.read-token.outputs.token || '' }}
        PI_ACTION_BOT_LOGIN: ''
        PI_ACTION_BOT_EMAIL: ''
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      working-directory: ${{ inputs.working-directory }}
      run: node "${{ github.action_path }}/../runner.mjs"

    - name: Mint App write token
      id: app-token
      if: >-
        ${{ inputs.app-client-id != '' && inputs.dry-run != 'true' && steps.gate.outputs.run == 'true' &&
        steps.pi.outcome == 'success' && steps.pi.outputs.rate-limited != 'true' }}
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ steps.inputs.outputs.owner }}
        repositories: ${{ steps.inputs.outputs.name }}
        permission-contents: read
        permission-pull-requests: write

    - name: Post review
      id: apply
      if: ${{ steps.gate.outputs.run == 'true' && steps.pi.outcome == 'success' && steps.pi.outputs.rate-limited != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token || inputs.github-token }}
        PI_REPO: ${{ inputs.repository }}
        PI_PR: ${{ inputs.pr-number }}
        PI_RESULT: ${{ steps.pi.outputs.result }}
        # Credentials the agent's process could read; a body containing one is never posted.
        PI_GUARDED_SECRETS: |
          ${{ inputs.cliproxyapi-api-key }}
          ${{ steps.read-token.outputs.token }}
        PI_HEAD_SHA: ${{ steps.gate.outputs.head-sha }}
        PI_BASE_REF: ${{ steps.gate.outputs.base-ref }}
        PI_PARTIAL_DIFF: ${{ steps.gate.outputs.partial-diff }}
        PI_REVIEW_MODE: ${{ inputs.mode }}
        PI_DRY_RUN: ${{ inputs.dry-run }}
        PI_MODEL_USED: ${{ steps.pi.outputs.model-used }}
      run: node "${{ github.action_path }}/apply.mjs"

    - name: Upload transcript
      if: ${{ always() && inputs.upload-transcript == 'true' && steps.pi.outputs.transcript != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: pi-review-${{ inputs.pr-number }}-${{ github.run_attempt }}
        path: ${{ steps.pi.outputs.transcript }}
        if-no-files-found: warn
        retention-days: 30
