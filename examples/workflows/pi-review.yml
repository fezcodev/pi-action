name: Pi Code Review

# One approve-or-request-changes review per push, posted as github-actions[bot].
# Older Pi reviews are collapsed. Optional repo guidance: .github/pi/review.md.
# Needs the CLIPROXYAPI_API_KEY secret and CLIPROXYAPI_BASE_URL variable.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  pi-review:
    uses: hank-warren/pi-action/.github/workflows/pr-review.yml@v1
    secrets:
      CLIPROXYAPI_API_KEY: ${{ secrets.CLIPROXYAPI_API_KEY }}
    # with:
    #   mode: comment        # never approve or block, just comment
    #   model: cpa/claude-opus-5-5
    #   fallback-models: cpa/gpt-6.2-sol
