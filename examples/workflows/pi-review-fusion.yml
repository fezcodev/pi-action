name: Pi Code Review (Fusion)

# Parallel multi-model PR review: runs multiple gateway models concurrently in isolated
# read-only sessions, skips synthesis on unanimous clean approvals, and otherwise runs an
# anonymized skeptical verifier pass before posting one review (and collapsing older ones).
# Needs the CLIPROXYAPI_API_KEY secret and CLIPROXYAPI_BASE_URL variable.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

jobs:
  pi-review:
    # Same-repo, human-authored PRs only: forks get no secrets, and bots are skipped.
    # `edited` runs only when the PR was retargeted to another base branch.
    if: >-
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pi-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: fezcodev/pi-action/pr-review-fusion@v1
        with:
          cliproxyapi-api-key: ${{ secrets.CLIPROXYAPI_API_KEY }}
          cliproxyapi-base-url: ${{ vars.CLIPROXYAPI_BASE_URL }}
          # Defaults: parallel cpa/gpt-6.2-sol + cpa/claude-opus-5-5 at thinking: medium,
          # synthesized by cpa/claude-opus-5-5 (falling back to cpa/gpt-6.2-sol).
          # models: |
          #   cpa/gpt-6.2-sol
          #   cpa/claude-opus-5-5
          # judge-model: cpa/claude-opus-5-5
          # instructions: |           # inline review guidance (appended after instructions-file)
          #   Focus on backwards-compatible API changes and SQL migrations.
          # instructions-file: .github/pi/review.md
          # mode: comment             # never approve or block, just comment
          # app-client-id: ${{ vars.PI_APP_CLIENT_ID }}        # post as your App instead of
          # app-private-key: ${{ secrets.PI_APP_PRIVATE_KEY }} # github-actions[bot]
