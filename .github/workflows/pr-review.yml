name: Pi PR Review

# Reusable workflow around ./pr-review, so a repo's review workflow is a short stub
# (examples/workflows/pi-review.yml). It runs the pr-review action from this
# repository at the exact commit the caller pinned, and keeps that checkout out of
# the agent's working directory. Posts as github-actions[bot] with GITHUB_TOKEN.
#
# Caller needs: a pull_request trigger, `permissions: contents: read,
# pull-requests: write`, the CLIPROXYAPI_API_KEY secret passed explicitly (not
# `secrets: inherit`, which would hand over every repo secret) and the
# CLIPROXYAPI_BASE_URL variable (or the cliproxyapi-base-url input).

on:
  workflow_call:
    inputs:
      # Defaults match pr-review/action.yml; CI fails if they drift.
      model:
        type: string
        default: 'cpa/gpt-6.2-sol'
      fallback-models:
        type: string
        default: 'cpa/claude-opus-5-5'
      thinking:
        type: string
        default: 'high'
      mode:
        description: '`verdict` approves or requests changes; `comment` never blocks.'
        type: string
        default: 'verdict'
      message-threads:
        type: string
        default: 'false'
      tools:
        type: string
        default: 'read,grep,find,ls'
      max-turns:
        type: string
        default: '40'
      timeout-minutes:
        type: string
        default: '20'
      on-rate-limit:
        type: string
        default: 'skip'
      dry-run:
        type: string
        default: 'false'
      upload-transcript:
        type: string
        default: 'true'
      cliproxyapi-base-url:
        description: 'Gateway URL. Empty uses the caller repository''s CLIPROXYAPI_BASE_URL variable.'
        type: string
        default: ''
      runs-on:
        type: string
        default: 'ubuntu-latest'
      job-timeout-minutes:
        description: 'Job limit; keep about 10 minutes above timeout-minutes for setup and posting.'
        type: number
        default: 30
    secrets:
      CLIPROXYAPI_API_KEY:
        required: false
    outputs:
      verdict:
        value: ${{ jobs.review.outputs.verdict }}
      event:
        value: ${{ jobs.review.outputs.event }}
      review-url:
        value: ${{ jobs.review.outputs.review-url }}
      model-used:
        value: ${{ jobs.review.outputs.model-used }}

jobs:
  review:
    # Same-repo, human-authored PRs only: forks get no secrets, and bots are skipped.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pi-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
      event: ${{ steps.review.outputs.event }}
      review-url: ${{ steps.review.outputs.review-url }}
      model-used: ${{ steps.review.outputs.model-used }}
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
          persist-credentials: false

      # job.workflow_* name this reusable workflow's own repository and commit, so the
      # action matches the ref the caller pinned (tag, branch or SHA) without rewriting.
      - name: Check out pi-action
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pi-action
          persist-credentials: false

      - name: Review
        id: review
        uses: ./.pi-action/pr-review
        with:
          working-directory: repo
          cliproxyapi-api-key: ${{ secrets.CLIPROXYAPI_API_KEY }}
          cliproxyapi-base-url: ${{ inputs.cliproxyapi-base-url || vars.CLIPROXYAPI_BASE_URL }}
          model: ${{ inputs.model }}
          fallback-models: ${{ inputs.fallback-models }}
          thinking: ${{ inputs.thinking }}
          mode: ${{ inputs.mode }}
          message-threads: ${{ inputs.message-threads }}
          tools: ${{ inputs.tools }}
          max-turns: ${{ inputs.max-turns }}
          timeout-minutes: ${{ inputs.timeout-minutes }}
          on-rate-limit: ${{ inputs.on-rate-limit }}
          dry-run: ${{ inputs.dry-run }}
          upload-transcript: ${{ inputs.upload-transcript }}
