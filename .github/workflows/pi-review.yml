name: Pi Code Review

# Dogfoods ./pr-review on this repo's own PRs, so a PR that changes the action
# reviews itself with its own code. Same job as examples/workflows/pi-review.yml.
# Repo guidance: .github/pi/review.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

jobs:
  pi-review:
    if: >-
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pi-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./pr-review
        with:
          cliproxyapi-api-key: ${{ secrets.CLIPROXYAPI_API_KEY }}
          cliproxyapi-base-url: ${{ vars.CLIPROXYAPI_BASE_URL }}
