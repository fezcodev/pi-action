name: Pi Code Review

# Dogfoods the reusable workflow on this repo's own PRs, so a PR that changes it
# reviews itself with its own code. Repo guidance: .github/pi/review.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  pi-review:
    uses: ./.github/workflows/pr-review.yml
    secrets: inherit
