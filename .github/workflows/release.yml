name: Release

# Tags the head of main as vX.Y.Z, publishes a GitHub release, and moves the floating
# major tag (v1) to it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, e.g. 1.3.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z, got '${VERSION}'"; exit 1; }
          tag="v${VERSION}"
          major="v${VERSION%%.*}"
          head="$(git rev-parse HEAD)"
          # A rerun resumes a release whose tag already points here; a tag elsewhere is refused.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            [ "$(git rev-parse "${tag}^{commit}")" = "$head" ] \
              || { echo "::error::${tag} already exists on another commit"; exit 1; }
          fi
          # Never move the major tag backwards (a stale rerun after a newer release).
          if git rev-parse -q --verify "refs/tags/${major}" >/dev/null \
              && ! git merge-base --is-ancestor "$(git rev-parse "${major}^{commit}")" "$head"; then
            echo "::error::${major} is ahead of this commit; refusing to move it back"; exit 1
          fi
          old_major="$(git rev-parse -q --verify "refs/tags/${major}^{commit}" || true)"
          previous="$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude "$tag" 2>/dev/null || true)"
          { echo "tag=${tag}"; echo "major=${major}"; echo "previous=${previous}"; echo "old_major=${old_major}"; } >> "$GITHUB_OUTPUT"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR: ${{ steps.version.outputs.major }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          OLD_MAJOR: ${{ steps.version.outputs.old_major }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/${TAG}"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=(--verify-tag --title "$TAG" --generate-notes)
            [ -n "$PREVIOUS" ] && args+=(--notes-start-tag "$PREVIOUS")
            gh release create "$TAG" "${args[@]}"
          fi
          git tag -f "$MAJOR" "$TAG^{}"
          # Only replace the major tag if nobody moved it since the ancestry check.
          git push --force-with-lease="refs/tags/${MAJOR}:${OLD_MAJOR}" origin "refs/tags/${MAJOR}"
          echo "Released ${TAG}; ${MAJOR} -> $(git rev-parse --short "$TAG^{}")" >> "$GITHUB_STEP_SUMMARY"
