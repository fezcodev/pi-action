name: Release

# Tags the head of main as vX.Y.Z, publishes a GitHub release, and moves the floating
# major tag (v1) to it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, e.g. 1.3.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z, got '${VERSION}'"; exit 1; }
          tag="v${VERSION}"
          major="v${VERSION%%.*}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists"; exit 1
          fi
          previous="$(git describe --tags --abbrev=0 --match 'v*.*.*' 2>/dev/null || true)"
          { echo "tag=${tag}"; echo "major=${major}"; echo "previous=${previous}"; } >> "$GITHUB_OUTPUT"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR: ${{ steps.version.outputs.major }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/${TAG}"
          args=(--verify-tag --title "$TAG" --generate-notes)
          [ -n "$PREVIOUS" ] && args+=(--notes-start-tag "$PREVIOUS")
          gh release create "$TAG" "${args[@]}"
          git tag -f "$MAJOR" "$TAG^{}"
          git push -f origin "refs/tags/${MAJOR}"
          echo "Released ${TAG}; ${MAJOR} -> $(git rev-parse --short "$TAG^{}")" >> "$GITHUB_STEP_SUMMARY"
